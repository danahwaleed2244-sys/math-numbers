<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4B3BC4">
<meta name="color-scheme" content="light">
<title>رحلة الرياضيات: الأعداد والعمليات عليها</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F4FF; --grid:#E4DFFA; --ink:#221C46; --muted:#625D80;
  --teal:#4B3BC4; --tealD:#33279A; --teal2:#7B6CF6; --mint:#EEEBFF; --sun:#FFB020; --sunD:#D98A00; --sunbg:#FFF5DC;
  --rose:#E5396B; --roseD:#B8204E; --rosebg:#FFE8EF; --sky:#1E9BD7; --skybg:#E3F4FC; --line:#E1DCF5;
  --ok:#12A06A; --okD:#0B7A50; --okbg:#E1F7EE;
  --body:'Readex Pro', 'Segoe UI', Tahoma, 'Noto Sans Arabic', sans-serif;
  --display:'Baloo Bhaijaan 2', 'Readex Pro', Tahoma, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:var(--body);color:var(--ink);font-size:17px;line-height:1.7;
  background-color:var(--paper);
  background-image:
    radial-gradient(ellipse 70% 40% at 100% 0%,rgba(123,108,246,.22),transparent 70%),
    radial-gradient(ellipse 60% 35% at 0% 8%,rgba(255,176,32,.16),transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 100%,rgba(229,57,107,.10),transparent 70%),
    radial-gradient(circle,var(--grid) 1.6px,transparent 1.7px);
  background-size:100% 100%,100% 100%,100% 100%,22px 22px;background-attachment:fixed;min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
a{color:var(--sky)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#app{max-width:760px;margin:0 auto;padding:14px 14px 40px}
.wide #app{max-width:1150px}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.35;margin:.3em 0}
h1{font-size:32px;color:var(--teal)}
h2{font-size:25px}
h3{font-size:20px}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.card.flat{box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--teal);color:#fff;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--teal);border:2px solid var(--teal)}
.btn.sun{background:var(--sun);color:#2b1d00}
.btn.rose{background:var(--rose)}
.btn.green{background:#1FA855}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:9px}
.btn.block{width:100%}
input[type=text],input[type=tel],input[type=password],input[type=number],input[type=date],input[type=url],select,textarea{
  width:100%;border:2px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;min-height:48px}
textarea{min-height:90px;line-height:1.6}
input:focus,select:focus,textarea:focus{border-color:var(--teal);outline:none}
label{font-weight:700;display:block;margin:10px 0 4px}
.pin{font-size:30px;letter-spacing:10px;text-align:center;direction:ltr}
.err{color:var(--rose);font-weight:700;min-height:1.4em}
.okmsg{color:var(--ok);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 11px;font-size:14px;font-weight:700;background:#EEF2F1;color:var(--muted);border:1.5px solid transparent;white-space:nowrap}
.chip.done{background:var(--okbg);color:var(--ok)}
.chip.now{background:var(--sunbg);color:#8a5a00}
.chip.rem{background:var(--rosebg);color:var(--rose)}
.badge{display:inline-block;border-radius:8px;padding:1px 7px;font-size:12.5px;font-weight:700;margin:2px;background:#EEF2F1;white-space:nowrap}
.b-rose{background:var(--rosebg);color:var(--rose)} .b-ok{background:var(--okbg);color:var(--ok)} .b-sun{background:var(--sunbg);color:#8a5a00} .b-sky{background:var(--skybg);color:var(--sky)}
.toast{position:fixed;inset-inline:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;z-index:99;font-weight:700;box-shadow:0 8px 24px rgba(30,42,67,.25)}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--display);font-size:21px;color:var(--teal)}
/* math */
.m{direction:rtl;unicode-bidi:isolate;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;line-height:1.15;margin:0 .12em}
.fr>span:first-child{border-bottom:1.6px solid currentColor;padding:0 .2em}
.fr>span:last-child{padding:0 .2em}
.mx{display:inline-flex;align-items:center;direction:rtl;white-space:nowrap;vertical-align:middle}.mx .fr{margin:0 .05em}
.rt{white-space:nowrap;display:inline-flex;align-items:flex-start}
.rs{font-size:1.05em;display:inline-block;transform:scaleX(-1)}
.rd{border-top:1.6px solid currentColor;padding:0 .1em;margin-top:.12em;line-height:1.25}
.ol{text-decoration:overline}
sup{font-size:.68em;line-height:0}
.m sup{display:inline-block;unicode-bidi:isolate;direction:rtl;vertical-align:.55em;line-height:1}
.qimg{display:block;max-width:100%;height:auto;margin:10px auto;border-radius:8px;background:#fff}
table.qt{border-collapse:collapse;margin:10px auto;font-weight:700;direction:rtl}
table.qt td{border:1.5px solid var(--ink);padding:6px 12px;text-align:center;min-width:44px}
table.qt td:first-child{background:#4a4f57;color:#fff}
/* journey map */
.map{position:relative;padding:6px 0 10px}
.station{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 26px;position:relative;cursor:pointer;width:88%;text-align:start}
.station:nth-child(even){margin-inline-start:12%}
.station::after{content:"";position:absolute;bottom:-28px;inset-inline-start:46px;height:26px;border-inline-start:3px dashed var(--teal2)}
.station:nth-child(even)::after{inset-inline-start:30px}
.station:last-child::after{display:none}
.st-ic{flex:0 0 58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--mint);color:var(--teal);font-family:var(--display);font-size:25px;position:relative;direction:ltr}
.station.complete .st-ic{background:var(--teal);color:#fff}
.station.complete .st-ic::after{content:"✓";position:absolute;top:-4px;left:-4px;background:var(--sun);color:#2b1d00;border-radius:50%;width:24px;height:24px;font-size:15px;display:grid;place-items:center;font-family:var(--body);font-weight:700}
.station.locked{opacity:.55;cursor:not-allowed}
.st-t{font-weight:700;font-size:17px;line-height:1.4}
.st-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
/* quiz */
.noselect{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar{height:10px;background:#E8EEEC;border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--teal2);border-radius:99px;transition:width .3s}
.stem{font-size:19px;font-weight:500;line-height:1.85}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{display:flex;align-items:center;gap:12px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;text-align:start;font-size:18px;min-height:56px;width:100%}
.opt .L{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#EEF2F1;font-weight:700}
.opt.sel{border-color:var(--teal);background:var(--mint)}
.opt.sel .L{background:var(--teal);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--rose);background:var(--rosebg)}
.opt img{max-width:100%;height:auto}
.exp{border-inline-start:5px solid var(--sun);background:var(--sunbg);border-radius:10px;padding:10px 14px;margin-top:12px}
.exp ol{margin:4px 0;padding-inline-start:22px}
.timer{font-family:var(--display);font-size:26px;color:var(--rose);direction:ltr}
.alertbox{background:var(--rosebg);border:2px solid var(--rose);border-radius:14px;padding:14px;margin:12px 0}
.alertbox h3{color:var(--rose);margin:0 0 6px}
.infobox{background:var(--skybg);border:2px solid #b9cff2;border-radius:14px;padding:12px 14px;margin:10px 0}
.sunbox{background:var(--sunbg);border:2px solid #f3d27c;border-radius:14px;padding:12px 14px;margin:10px 0}
.steps{display:grid;gap:10px}
.step{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px}
.step .n{flex:0 0 40px;height:40px;border-radius:50%;background:var(--mint);color:var(--teal);font-weight:700;display:grid;place-items:center}
.step.done .n{background:var(--teal);color:#fff}
.bigpin{font-family:var(--display);font-size:64px;letter-spacing:14px;direction:ltr;text-align:center;color:var(--teal);background:var(--mint);border-radius:16px;padding:8px}
/* games */
.gg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{border:2px solid var(--line);border-radius:12px;background:#fff;min-height:80px;padding:8px;display:grid;place-items:center;text-align:center;font-size:16px}
.gcard.back{background:var(--teal);color:#fff;font-family:var(--display);font-size:28px}
.gcard.hit{border-color:var(--ok);background:var(--okbg)}
.gcard.pick{border-color:var(--sun);background:var(--sunbg)}
/* stars */
.stars{display:flex;gap:6px;direction:ltr;justify-content:center}
.stars button{background:none;border:0;font-size:42px;line-height:1;color:#cfd6d3;padding:2px}
.stars button.on{color:var(--sun)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,30,45,.55);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.modal>.box{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.modal{align-items:center}.modal>.box{border-radius:18px}}
.x{float:left;background:#EEF2F1;border:0;border-radius:50%;width:38px;height:38px;font-size:18px}
/* teacher */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;position:sticky;top:0;background:var(--paper);z-index:5}
.tabs button{white-space:nowrap;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:700}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px}
.kpi b{display:block;font-family:var(--display);font-size:30px;color:var(--teal);line-height:1.2}
.kpi span{font-size:14px;color:var(--muted)}
.kpi.click{cursor:pointer;border-color:#9fd2c9}
.tw{overflow-x:auto;border:1.5px solid var(--line);border-radius:12px;background:#fff}
table.dt{border-collapse:collapse;width:100%;font-size:14.5px}
table.dt th,table.dt td{padding:8px 9px;border-bottom:1px solid #E6ECEA;text-align:start;vertical-align:middle}
table.dt th{background:#F1F5F3;position:sticky;top:0;cursor:pointer;white-space:nowrap}
table.dt td.n{direction:ltr;text-align:center;unicode-bidi:isolate}
.acts{display:flex;gap:4px;flex-wrap:nowrap}
.acts button{border:1.5px solid var(--line);background:#fff;border-radius:8px;min-width:36px;min-height:34px;font-size:15px}
.chart{width:100%;height:auto;background:#fff;border:1.5px solid var(--line);border-radius:12px}
.foot{text-align:center;color:var(--muted);font-size:13.5px;margin-top:30px}
.intro{margin-top:10px;font-weight:700;color:var(--ink,#1f2937);line-height:1.8}
.snum{flex:0 0 38px;height:38px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.tlinkbox{text-align:center;margin:14px 0 26px}
.tlink{display:inline-block;color:var(--muted);font-size:14px;text-decoration:none;border:1.5px solid var(--line);border-radius:999px;padding:8px 18px;background:#fff}
.inapp{background:var(--sun);color:#2b1d00;padding:12px 14px;border-radius:12px;margin:8px 0;font-weight:700}
iframe.vid{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
/* print / pdf pages */
#printArea{display:none}
.page{width:794px;min-height:1123px;padding:46px 50px;background:#fff;color:#111;font-family:'Readex Pro',Tahoma,sans-serif;font-size:17px;line-height:1.75;direction:rtl;position:relative;page-break-after:always;break-after:page;overflow:hidden}
.page.land{width:1123px;min-height:794px}
.page h1{font-family:'Readex Pro',Tahoma,sans-serif;font-weight:700;font-size:28px;color:#4B3BC4}
.page h2{font-family:'Readex Pro',Tahoma,sans-serif;font-weight:700;font-size:22px;color:#4B3BC4;border-bottom:3px solid #FFB020;padding-bottom:4px;margin:18px 0 10px}
.page table{border-collapse:collapse;width:100%;font-size:16px}
.page th,.page td{border:1px solid #9aa9a4;padding:5px 8px;text-align:center}
.page th{background:#EEEBFF}
.page .hdr{display:flex;justify-content:space-between;border-bottom:2px solid #4B3BC4;padding-bottom:8px;margin-bottom:12px;font-size:15px;font-weight:700}
.page .sig{display:flex;justify-content:space-between;margin-top:40px;font-weight:700;font-size:18px}
.page .num{direction:ltr;unicode-bidi:isolate}
.pdfwrap{overflow:auto;max-height:52vh;border:1.5px solid var(--line);border-radius:10px;background:#e9eeec;padding:8px}
.pdfwrap .page{transform-origin:top right;margin-bottom:10px}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea .page{box-shadow:none;margin:0}
}

/* ===== تصميم ١٫٤: ألوان جديدة وأيقونات ثلاثية الأبعاد ===== */
h1{color:var(--ink);font-size:34px;letter-spacing:0}
h2{color:var(--ink)}
.brand{color:var(--teal);font-weight:800}
.card{border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 2px 0 var(--line),0 14px 30px -20px rgba(34,28,70,.45)}
/* أزرار بارزة */
.btn{background:linear-gradient(180deg,#6A5AE6,var(--teal));box-shadow:0 4px 0 var(--tealD),0 10px 18px -8px rgba(75,59,196,.6);border-radius:14px;transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--tealD),0 4px 8px -4px rgba(75,59,196,.5)}
.btn.sec{background:#fff;color:var(--teal);border:2px solid var(--teal);box-shadow:0 4px 0 #D6D0F7}
.btn.sun{background:linear-gradient(180deg,#FFC94D,var(--sun));color:#3A2500;box-shadow:0 4px 0 var(--sunD),0 10px 18px -8px rgba(217,138,0,.6)}
.btn.rose{background:linear-gradient(180deg,#F2648C,var(--rose));box-shadow:0 4px 0 var(--roseD),0 10px 18px -8px rgba(229,57,107,.55)}
.btn.green{background:linear-gradient(180deg,#33C77E,#16A862);box-shadow:0 4px 0 #0B7A50,0 10px 18px -8px rgba(18,160,106,.55)}
.btn.ghost{background:#fff;box-shadow:0 3px 0 var(--line);border:1.5px solid var(--line)}
.btn.sm{box-shadow:0 3px 0 var(--tealD)}
.btn.sm.ghost,.btn.sm.sec{box-shadow:0 3px 0 var(--line)}
input[type=text],input[type=tel],input[type=password],input[type=number],input[type=date],input[type=url],select,textarea{border-radius:14px;background:#FBFAFF}
/* الأيقونة ثلاثية الأبعاد */
.ic3d,.st-ic,.snum,.step .n,.opt .L{
  --c1:#8E80FF;--c2:#4B3BC4;--c3:#2E2390;
  background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.75) 0 8%,transparent 30%),linear-gradient(150deg,var(--c1),var(--c2));
  color:#fff;text-shadow:0 2px 0 var(--c3),0 3px 6px rgba(0,0,0,.25);
  box-shadow:inset 0 3px 2px rgba(255,255,255,.45),inset 0 -5px 0 rgba(0,0,0,.18),0 5px 0 var(--c3),0 12px 16px -6px rgba(34,28,70,.45);
}
.st-ic{flex:0 0 62px;height:62px;border-radius:20px;font-size:28px;font-weight:800;margin-bottom:5px}
.station{border:1px solid var(--line);border-radius:22px;box-shadow:0 2px 0 var(--line),0 14px 26px -20px rgba(34,28,70,.5)}
.station::after{border-inline-start:3px dashed var(--teal2)}
.station:nth-child(7n+1) .st-ic{--c1:#9B8CFF;--c2:#5543D6;--c3:#33279A}
.station:nth-child(7n+2) .st-ic{--c1:#FF8FB1;--c2:#E5396B;--c3:#A81C48}
.station:nth-child(7n+3) .st-ic{--c1:#5FD3F5;--c2:#1E9BD7;--c3:#0E6A9C}
.station:nth-child(7n+4) .st-ic{--c1:#FFD36B;--c2:#F59E0B;--c3:#B76E00}
.station:nth-child(7n+5) .st-ic{--c1:#5EE0A6;--c2:#12A06A;--c3:#0B6E49}
.station:nth-child(7n+6) .st-ic{--c1:#FFA27A;--c2:#F2633A;--c3:#B23F1C}
.station:nth-child(7n+7) .st-ic{--c1:#C89BFF;--c2:#9146E6;--c3:#61249F}
.station.complete .st-ic{color:#fff}
.station.complete .st-ic::after{background:linear-gradient(150deg,#5EE0A6,#12A06A);color:#fff;box-shadow:0 2px 0 #0B6E49;border:2px solid #fff;width:26px;height:26px}
.station.locked .st-ic{--c1:#C9C5DC;--c2:#9893B3;--c3:#6E6990}
.snum,.step .n{border-radius:14px;font-weight:800;font-size:19px;margin-bottom:4px}
.step{border:1px solid var(--line);border-radius:18px;box-shadow:0 2px 0 var(--line)}
.steps .step:nth-child(2) .snum{--c1:#FF8FB1;--c2:#E5396B;--c3:#A81C48}
.steps .step:nth-child(3) .snum{--c1:#5EE0A6;--c2:#12A06A;--c3:#0B6E49}
.opt{border:2px solid var(--line);border-radius:16px;box-shadow:0 3px 0 var(--line)}
.opt .L{--c1:#D9D4F7;--c2:#B6AEEA;--c3:#8C82CF;border-radius:12px;text-shadow:none;color:var(--ink);box-shadow:inset 0 2px 1px rgba(255,255,255,.6),0 3px 0 var(--c3)}
.opt.sel{border-color:var(--teal);background:var(--mint);box-shadow:0 3px 0 var(--teal2)}
.opt.sel .L{--c1:#8E80FF;--c2:#4B3BC4;--c3:#2E2390;color:#fff}
.opt.right{box-shadow:0 3px 0 var(--ok)} .opt.wrong{box-shadow:0 3px 0 var(--rose)}
/* واجهة البداية */
.hero{position:relative;overflow:hidden;text-align:center;border:0;color:#fff;
  background:radial-gradient(circle at 85% 10%,rgba(255,255,255,.18),transparent 40%),linear-gradient(160deg,#6A5AE6 0%,#4B3BC4 55%,#3A2DA6 100%);
  box-shadow:0 6px 0 #2E2390,0 22px 40px -18px rgba(46,35,144,.7)}
.hero h1{color:#fff;font-size:34px;margin:.2em 0 .1em;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.hero .muted{color:#E3DEFF}
.hero .intro{color:#fff;background:rgba(255,255,255,.12);border-radius:14px;padding:8px 12px;font-weight:600}
.tiles{display:flex;justify-content:center;gap:10px;direction:ltr;margin:6px 0 10px;flex-wrap:wrap}
.tile{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:27px;line-height:1}
.tile:nth-child(1){--c1:#FFD36B;--c2:#F59E0B;--c3:#B76E00;transform:rotate(-8deg)}
.tile:nth-child(2){--c1:#FF8FB1;--c2:#E5396B;--c3:#A81C48;transform:translateY(-6px) rotate(5deg)}
.tile:nth-child(3){--c1:#5FD3F5;--c2:#1E9BD7;--c3:#0E6A9C;transform:rotate(-3deg)}
.tile:nth-child(4){--c1:#5EE0A6;--c2:#12A06A;--c3:#0B6E49;transform:translateY(-6px) rotate(7deg)}
.tile:nth-child(5){--c1:#FFA27A;--c2:#F2633A;--c3:#B23F1C;transform:rotate(-6deg)}
.top .chip{background:#fff;color:var(--teal);border:1px solid var(--line);box-shadow:0 2px 0 var(--line)}
.chip{border-radius:999px}
.chip.done{background:var(--okbg);color:var(--okD)}
.kpi{border:1px solid var(--line);border-radius:18px;box-shadow:0 2px 0 var(--line)}
.kpi b{font-weight:800}
.tabs{background:rgba(246,244,255,.92);backdrop-filter:blur(6px);padding-top:6px}
.tabs button{border-radius:12px;border:1px solid var(--line);box-shadow:0 2px 0 var(--line)}
.tabs button.on{background:linear-gradient(180deg,#6A5AE6,var(--teal));border-color:var(--teal);box-shadow:0 3px 0 var(--tealD)}
.bigpin{font-weight:800;color:var(--teal);background:var(--mint);border-radius:20px;box-shadow:inset 0 -4px 0 #DCD6FF}
.bar{background:#ECE9FA}.bar>i{background:linear-gradient(90deg,var(--teal2),var(--teal))}
.timer{font-weight:800}
.tlink{border-radius:999px;box-shadow:0 2px 0 var(--line);color:var(--teal);font-weight:600}
.exp{border-radius:14px}
.alertbox,.infobox,.sunbox{border-radius:18px}
.gcard{border-radius:16px;box-shadow:0 3px 0 var(--line)}
.gcard.back{background:linear-gradient(150deg,#8E80FF,#4B3BC4);box-shadow:0 4px 0 #2E2390}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* تحويل الكتابة الرياضية إلى عرض صحيح */
function fmt(s){
  let o=String(s??'').replace(/\[\[/g,'⟦').replace(/\]\]/g,'⟧');
  for(let i=0;i<5;i++){
    o=o.replace(/√\{([^{}]*)\}/g,'<span class="rt"><span class="rs">√</span><span class="rd">$1</span></span>')
       .replace(/‾\{([^{}]*)\}/g,'<span class="ol">$1</span>')
       .replace(/\^\{([^{}]*)\}/g,'<sup>$1</sup>')
       .replace(/\{([^{}\/ ]+) ([^{}\/ ]+)\/([^{}]+)\}/g,'<span class="mx"><span class="fr"><span>$2</span><span>$3</span></span><span class="mw">$1</span></span>')
       .replace(/\{([^{}\/]+)\/([^{}]+)\}/g,'<span class="fr"><span>$1</span><span>$2</span></span>');
  }
  o=o.replace(/⟦([^⟧]*)⟧/g,(m,x)=>'<span class="m">'+x.replace(/(^|[\s(\[{=+×÷,])-(?=[\d√(])/g,'$1−').replace(/, /g,'، ')+'</span>');
  return toAr(o);
}

function cleanName(s){
  return String(s??'').replace(/[\u200B-\u200F\u202A-\u202E\u2066-\u2069\uFEFF\u00AD]/g,'')
    .replace(/[0-9٠-٩۰-۹]/g,'').replace(/[^\u0600-\u06FFa-zA-Z\s]/g,' ')
    .replace(/[\u064B-\u0652\u0640]/g,'').replace(/\s+/g,' ').trim();
}
function normName(s){
  return cleanName(s).replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
   .replace(/\bعبد\s+/g,'عبد').replace(/\s+/g,' ').trim();
}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array(n+1).fill(0).map((_,j)=>j);
  for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function sim(a,b){a=normName(a);b=normName(b);if(!a||!b)return 0;if(a===b)return 1;
  const r=1-lev(a,b)/Math.max(a.length,b.length);
  const ta=a.split(' '),tb=b.split(' ');const k=Math.min(ta.length,tb.length,3);let same=0;for(let i=0;i<k;i++)if(ta[i]===tb[i])same++;
  const t=k?same/Math.max(Math.min(ta.length,3),Math.min(tb.length,3)):0;
  return Math.max(r,t*0.95)}

async function sha(s){return b64(await crypto.subtle.digest('SHA-256',te.encode(s)))}
async function kdf(code,salt){const k=await crypto.subtle.importKey('raw',te.encode(code),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(salt),iterations:120000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function aesEnc(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(obj)));return{iv:b64(iv),ct:b64(ct)}}
async function aesDec(key,o){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.ct));return JSON.parse(new TextDecoder().decode(pt))}
async function rsaEncPin(pin){ try{ if(!TM.teacher||!TM.teacher.pub) return '';
  const k=await crypto.subtle.importKey('spki',unb64(TM.teacher.pub),{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);
  return b64(await crypto.subtle.encrypt({name:'RSA-OAEP'},k,te.encode(pin))) }catch(e){return ''} }

          set(k,v){try{localStorage.setItem(this._k(k),JSON.stringify(v))}catch(e){}}, del(k){try{localStorage.setItem(this._k(k),'null')}catch(e){}}};

const DB={

    (E['__new_'+s.id]||[]).forEach(nq=>{ if(!s.qs.find(x=>x.id===nq.id)) s.qs.push(Object.assign({},nq,{_orig:JSON.parse(JSON.stringify(nq))})) });

/* حسابات الطالبة */
function scoreOf(part){ if(!part||!part.done) return null; return part.score }
function stInfo(rec,sid){
  const S=(rec.stages||{})[sid]||{};
  const pre=scoreOf(S.pre), post=scoreOf(S.post);
  const imp=(pre!=null&&post!=null)?post-pre:null;
  const needRem=imp!=null&&imp<=0;
  const rem=S.rem||{}; const remScore=rem.test&&rem.test.done?rem.test.score:null;
  const trainDone=!!(S.train&&S.train.done);
  return {S,pre,post,imp,needRem,remScore,remDone:remScore!=null,trainDone,complete:post!=null};
}
function grade(p){ if(p==null) return '—'; if(p>=90) return 'ممتاز'; if(p>=80) return 'جيد جدًا'; if(p>=70) return 'جيد'; if(p>=60) return 'مقبول'; return 'ضعيف' }
function summary(rec,onlySid){
  const ids=onlySid?[onlySid]:STAGES.map(s=>s.id);
  let pres=[],posts=[],imps=[],done=0,needRem=0,remDone=0,remBetter=0;
  ids.forEach(id=>{const i=stInfo(rec,id); if(i.pre!=null)pres.push(i.pre); if(i.post!=null){posts.push(i.post);done++} if(i.imp!=null)imps.push(i.imp);
    if(i.needRem){needRem++; if(i.remDone){remDone++; if(i.remScore>i.post)remBetter++}}});
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  return {pre:avg(pres),post:avg(posts),imp:avg(imps),done,needRem,remDone,remBetter,allDone:done===STAGES.length,anyDone:done>0};
}
function lateDays(rec){
  if(!TM.deadline) return 0; const dl=endOfDay(TM.deadline);
  const sm=summary(rec); const ref=sm.allDone?Math.max(...STAGES.map(s=>((rec.stages||{})[s.id]?.post?.finishedAt)||0)):Date.now();
  return ref>dl?Math.ceil((ref-dl)/DAY):0;
}

function openStage(sid,focus){

     <div class="steps">${st(1,rt,'تدريب مركّز','على المؤشرات التي أخطأتِ فيها',`<button class="btn sm rose" onclick="startTrain('${sid}','rem')">${rt?'مراجعة':'ابدئي'}</button>`)}
     ${st(2,i.remDone,'الاختبار العلاجي',i.remDone?'نتيجتك '+pct(i.remScore):'بعد التدريب المركّز',i.remDone?`<span class="chip done">✓ علاجي ${pct(i.remScore)}</span>`:rt?`<button class="btn sm rose" onclick="startTest('${sid}','rem')">${i.S.rem&&i.S.rem.test?'أكملي':'ابدئي'}</button>`:'<span class="chip">🔒</span>')}</div></div>`;

function ytId(u){const m=String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:null}
function openMedia(url,title){
  const id=ytId(url); let body;
  if(id) body=`<iframe class="vid" src="https://www.youtube-nocookie.com/embed/${id}" allow="encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
  else if(/wordwall\.net\/(?:[a-z-]+\/)?embed\//.test(url)) body=`<iframe class="vid" style="aspect-ratio:4/3" src="${esc(url)}" allowfullscreen></iframe>`;
  else { window.open(url,'_blank','noopener'); return }
  modal(`<h3>${esc(title)}</h3>${body}<div class="row" style="margin-top:8px"><a class="btn sm ghost" href="${esc(url)}" target="_blank" rel="noopener">فتح في نافذة جديدة</a></div>`);
}
function modal(h){closeModal();const m=document.createElement('div');m.className='modal';m.id='mdl';m.innerHTML=`<div class="box"><button class="x" aria-label="إغلاق" onclick="closeModal()">✕</button>${h}</div>`;m.onclick=e=>{if(e.target===m)closeModal()};document.body.appendChild(m);return m}
function closeModal(){const m=$('#mdl');if(m)m.remove()}

/* ================= الاختبارات (قبلي/بعدي/علاجي) ================= */
function blockCopy(e){if(QUIZ)e.preventDefault()}
['copy','cut','contextmenu','selectstart'].forEach(ev=>document.addEventListener(ev,blockCopy));
document.addEventListener('visibilitychange',()=>{
  if(!QUIZ||QUIZ.mode!=='test') return;
  if(document.visibilityState==='hidden'){ QUIZ.part.exits=(QUIZ.part.exits||0)+1; ME.exitsTotal=(ME.exitsTotal||0)+1; saveMe(true) }
  else toast(`⚠️ خرجتِ من صفحة الاختبار (${toAr(QUIZ.part.exits)} ${QUIZ.part.exits===1?'مرة':'مرات'}) — يظهر هذا للمعلمة`,3500);
});
function partOf(sid,kind,create){
  ME.stages=ME.stages||{}; const S=ME.stages[sid]=ME.stages[sid]||{};
  if(kind==='rem'){S.rem=S.rem||{}; if(create&&!S.rem.test) S.rem.test={answers:{},idx:0,exits:0}; return S.rem.test}
  if(create&&!S[kind]) S[kind]={answers:{},idx:0,exits:0};
  return S[kind];
}
function startTest(sid,kind){
  const s=stageById(sid); const part=partOf(sid,kind,true);
  if(!part.order){ part.order=(kind==='rem'?shuffle(testQs(s)):testQs(s)).map(q=>q.id); part.startedAt=Date.now() }
  const qs=part.order.map(id=>s.qs.find(q=>q.id===id)).filter(Boolean);
  QUIZ={mode:'test',sid,kind,part,qs,shown:Date.now()}; saveMe();
  renderTestQ();
}
/* ترتيب الخيارات: القبلي كما في الملف، والبعدي بترتيب مختلف ثابت (كل خيار يتغير مكانه) */
function optOrder(q,kind){
  const n=q.opts.length, idx=[...Array(n).keys()];
  if(kind!=='post'||n<2) return idx;
  let h=0; for(const c of String(q.id)) h=(h*31+c.charCodeAt(0))>>>0;
  const r=1+(h%(n-1));
  return idx.map(j=>(j+r)%n);
}
function renderTestQ(){
  const {part,qs,kind,sid}=QUIZ; const i=Math.min(part.idx,qs.length-1), q=qs[i];
  const name={pre:'الاختبار القبلي',post:'الاختبار البعدي',rem:'الاختبار العلاجي'}[kind];
  const sel=(part.answers[q.id]||{}).a;
  QUIZ.shown=Date.now();
  setView(`<div class="noselect"><div class="qhead"><b>${name} — ${esc(stageById(sid).title)}</b><button class="btn sm ghost" onclick="QUIZ=null;openStage('${sid}')">حفظ وخروج</button></div>
   <div class="small muted">سؤال ${toAr(i+1)} من ${toAr(qs.length)}${part.exits?` — خرجتِ ${toAr(part.exits)}×`:''}</div>
   <div class="bar"><i style="width:${Math.round(i/qs.length*100)}%"></i></div>
   <div class="card">${qBody(q)}<div class="opts">${optOrder(q,kind).map((k,j)=>`<button class="opt ${sel===k?'sel':''}" data-k="${k}" onclick="pickTest(${k})"><span class="L">${LET[j]}</span><span class="grow">${optHTML(q.opts[k])}</span></button>`).join('')}</div></div>
   <button class="btn block" id="nx" ${sel==null?'disabled':''} onclick="nextTest()">${i===qs.length-1?'إنهاء الاختبار':'التالي'}</button></div>`);
}
function pickTest(k){
  const {part,qs}=QUIZ; const q=qs[part.idx]; const prev=part.answers[q.id];
  const t=Math.round((Date.now()-QUIZ.shown)/1000)+((prev&&prev.t)||0);
  part.answers[q.id]={a:k,ok:k===q.ans,t};
  $$('.opt').forEach(b=>b.classList.toggle('sel',+b.dataset.k===k)); $('#nx').disabled=false; saveMe();
}
function nextTest(){
  const {part,qs}=QUIZ; const q=qs[part.idx]; const a=part.answers[q.id];
  if(a&&a.t<10){ part.rushed=(part.rushed||0)+1; ME.rushed=(ME.rushed||0)+1 }
  if(part.idx<qs.length-1){part.idx++;saveMe();return renderTestQ()}
  part.score=Math.round(qs.filter(x=>(part.answers[x.id]||{}).ok).length/qs.length*100);
  part.done=true; part.finishedAt=Date.now(); const {sid,kind}=QUIZ; QUIZ=null; saveMe(true);
  const i=stInfo(ME,sid);
  let msg='';
  if(kind==='pre') msg='أحسنتِ! الآن انتقلي إلى التدريب، وبعده الاختبار البعدي.';
  if(kind==='post') msg= i.imp>0?`🎉 تحسّنتِ بمقدار ${pct(i.imp)}! تقديرك: ${grade(i.post)}`:'لا بأس 🌱 فُتحت لكِ خطة علاجية قصيرة لتثبيت المهارات.';
  if(kind==='rem') msg=`نتيجة الاختبار العلاجي: ${pct(part.score)} ${part.score>i.post?'— تحسّن رائع 👏':''}`;
  setView(`<div class="card" style="text-align:center"><h2>انتهى الاختبار ✓</h2><div class="bigpin" style="letter-spacing:2px">${pct(part.score)}</div>
    <p style="font-size:19px">${msg}</p><button class="btn block" onclick="openStage('${sid}','${kind==='post'&&i.needRem?'rem':''}')">متابعة</button></div>`);
}

/* ================= التدريب: المحطات / التحدي / العلاجي ================= */
let TR=null, TT=null;
function startTrain(sid,mode){
  const s=stageById(sid); ME.stages=ME.stages||{}; const S=ME.stages[sid]=ME.stages[sid]||{};
  let qs=trainQs(s), st;
  if(mode==='rem'){
    const post=S.post||{answers:{}}; const wrongInd=new Set(testQs(s).filter(q=>!(post.answers[q.id]||{}).ok).map(q=>q.ind));
    let f=qs.filter(q=>wrongInd.has(q.ind)); if(!f.length) f=qs;
    S.rem=S.rem||{}; st=S.rem.train=S.rem.train||{idx:0,answers:{}}; st.order=st.order||f.map(q=>q.id); qs=st.order.map(id=>s.qs.find(q=>q.id===id)).filter(Boolean);
  } else if(mode==='challenge'){ st={idx:0,answers:{},points:0}; qs=shuffle(qs) }
  else { st=S.train=S.train||{idx:0,answers:{}}; if(st.done){st.idx=0;st.answers={};st.review=true} }
  if(!qs.length){toast('لا توجد أسئلة تدريب في هذه المرحلة بعد');return}
  TR={sid,mode,st,qs}; renderTrainQ();
}
function renderTrainQ(){
  const {st,qs,mode,sid}=TR; const i=st.idx, q=qs[i]; const a=st.answers[q.id];
  clearInterval(TT);
  const title={train:'المحطات',challenge:'⚡ وضع التحدي',rem:'🔁 التدريب المركّز'}[mode];
  setView(`<div class="qhead"><b>${title}</b>${mode==='challenge'?`<span class="timer" id="tm">${toAr(25)}</span>`:''}<button class="btn sm ghost" onclick="clearInterval(TT);openStage('${sid}')">خروج</button></div>
   <div class="small muted">محطة ${toAr(i+1)} من ${toAr(qs.length)}${mode==='challenge'?` — النقاط: ${toAr(st.points)}`:''}</div>
   <div class="bar"><i style="width:${Math.round(i/qs.length*100)}%"></i></div>
   <div class="card">${qBody(q)}<div class="opts">${q.opts.map((o,k)=>{let c='';if(a){if(k===q.ans)c='right';else if(k===a.a)c='wrong'}
     return `<button class="opt ${c}" ${a?'disabled':''} onclick="pickTrain(${k})"><span class="L">${LET[k]}</span><span class="grow">${optHTML(o)}</span></button>`}).join('')}</div>
   <div id="fb">${a?fbHTML(q,a):''}</div></div>
   ${a?`<button class="btn block" onclick="nextTrain()">${i===qs.length-1?'إنهاء':'المحطة التالية'}</button>`:''}`);
  if(mode==='challenge'&&!a){ let left=25; TT=setInterval(()=>{left--; const e=$('#tm'); if(e)e.textContent=toAr(left); if(left<=0){clearInterval(TT);pickTrain(-1)}},1000); TR.t0=Date.now() }
}
function fbHTML(q,a){return (a.ok?'<div class="okmsg">✓ إجابة صحيحة، أحسنتِ!</div>':a.a===-1?'<div class="err">⏱ انتهى الوقت</div>':'<div class="err">✗ إجابة غير صحيحة</div>')+expHTML(q)}
function pickTrain(k){
  clearInterval(TT); const {st,qs,mode}=TR; const q=qs[st.idx]; if(st.answers[q.id]) return;
  const ok=k===q.ans; st.answers[q.id]={a:k,ok};
  if(mode==='challenge'&&ok) st.points+=10+Math.max(0,25-Math.round((Date.now()-TR.t0)/1000));
  if(mode!=='challenge') saveMe(); renderTrainQ();
}
function nextTrain(){
  const {st,qs,mode,sid}=TR;
  if(st.idx<qs.length-1){st.idx++; if(mode!=='challenge')saveMe(); return renderTrainQ()}
  const right=qs.filter(q=>(st.answers[q.id]||{}).ok).length;
  const S=ME.stages[sid];
  if(mode==='challenge'){ S.train=S.train||{idx:0,answers:{}}; S.train.best=Math.max(S.train.best||0,st.points) }
  else { st.done=true; st.correct=right; st.finishedAt=st.finishedAt||Date.now() }
  saveMe(true);
  setView(`<div class="card" style="text-align:center"><h2>${mode==='challenge'?'انتهى التحدي ⚡':'أنهيتِ المحطات ✓'}</h2>
   <p style="font-size:20px">${mode==='challenge'?`نقاطك: <b>${toAr(st.points)}</b>`:`إجابات صحيحة: ${toAr(right)} من ${toAr(qs.length)}`}</p>
   <p>${mode==='rem'?'الآن ادخلي «الاختبار العلاجي».':mode==='train'?'الاختبار البعدي مفتوح الآن.':''}</p>
   <button class="btn block" onclick="openStage('${sid}','${mode==='rem'?'rem':''}')">متابعة</button></div>`);
}

/* ================= الألعاب (من أسئلة التدريب فقط) ================= */
function game(sid,kind){
  const s=stageById(sid); const all=trainQs(s).filter(q=>!q.opts.some(o=>String(o).startsWith('img:')));
  if(all.length<2){toast('لا توجد أسئلة تدريب كافية لهذه اللعبة');return}
  const back=`<button class="btn sm ghost" onclick="openStage('${sid}')">→ رجوع</button>`;
  if(kind==='tf'){
    const items=shuffle(all).map(q=>{const t=Math.random()<.5;let k=q.ans;if(!t){const o=[0,1,2,3].filter(x=>x!==q.ans);k=o[Math.floor(Math.random()*3)]}return{q,k,t}});
    let i=0,score=0;
    const draw=()=>{ if(i>=items.length) return setView(`<div class="card" style="text-align:center"><h2>صح أو خطأ ✓</h2><p style="font-size:20px">نتيجتك ${toAr(score)} من ${toAr(items.length)}</p>${back}</div>`);
      const it=items[i]; setView(`<div class="qhead"><b>صح أو خطأ</b>${back}</div><div class="small muted">${toAr(i+1)} من ${toAr(items.length)}</div>
      <div class="card">${qBody(it.q)}<div class="sunbox" style="font-size:19px">الإجابة: ${optHTML(it.q.opts[it.k])}</div>
      <div class="row"><button class="btn grow green" id="T">✓ صح</button><button class="btn grow rose" id="F">✗ خطأ</button></div><div id="fb"></div></div>`);
      const ans=v=>{ const ok=v===it.t; if(ok)score++; $('#fb').innerHTML=(ok?'<div class="okmsg">✓ أحسنتِ</div>':'<div class="err">✗ ليس كذلك</div>')+(it.t?'':`<div class="small">الصحيح: ${optHTML(it.q.opts[it.q.ans])}</div>`)+`<button class="btn block" style="margin-top:8px" id="nx">التالي</button>`;
        $('#T').disabled=$('#F').disabled=true; $('#nx').onclick=()=>{i++;draw()} };
      $('#T').onclick=()=>ans(true); $('#F').onclick=()=>ans(false) };
    return draw();
  }
  const pool=shuffle(all.filter(q=>!q.img&&!q.table)).slice(0,4); const use=pool.length>=2?pool:shuffle(all).slice(0,4);
  if(kind==='match'){
    let pick=null,done=new Set();
    const right=shuffle(use.map(q=>q.id));
    const draw=()=>{ setView(`<div class="qhead"><b>التوصيل</b>${back}</div><p class="small muted">اضغطي على السؤال ثم على إجابته.</p>
      <div class="gg"><div class="col">${use.map(q=>`<button class="gcard ${done.has(q.id)?'hit':pick===q.id?'pick':''}" data-q="${q.id}" style="font-size:14px">${fmt(q.stem)}</button>`).join('')}</div>
      <div class="col">${right.map(id=>{const q=use.find(x=>x.id===id);return `<button class="gcard ${done.has(id)?'hit':''}" data-a="${id}">${optHTML(q.opts[q.ans])}</button>`}).join('')}</div></div>
      ${done.size===use.length?`<div class="okmsg" style="text-align:center;margin-top:12px">🎉 أكملتِ التوصيل!</div>`:''}`);
      $$('[data-q]').forEach(b=>b.onclick=()=>{if(!done.has(b.dataset.q)){pick=b.dataset.q;draw()}});
      $$('[data-a]').forEach(b=>b.onclick=()=>{ if(!pick||done.has(b.dataset.a))return; if(b.dataset.a===pick){done.add(pick);pick=null;draw()} else {b.classList.add('wrong');toast('حاولي مرة أخرى')} });
    }; return draw();
  }
  if(kind==='mem'){
    const cards=shuffle(use.flatMap(q=>[{id:q.id,h:fmt(q.stem),t:'q'},{id:q.id,h:optHTML(q.opts[q.ans]),t:'a'}]));
    let open=[],hit=new Set(),moves=0,lock=false;
    const draw=()=>{ setView(`<div class="qhead"><b>الذاكرة</b>${back}</div><p class="small muted">طابقي كل سؤال مع إجابته. المحاولات: ${toAr(moves)}</p>
      <div class="gg">${cards.map((c,j)=>{const show=open.includes(j)||hit.has(c.id);return `<button class="gcard ${show?(hit.has(c.id)?'hit':''):'back'}" data-j="${j}" style="font-size:14px">${show?c.h:'؟'}</button>`}).join('')}</div>
      ${hit.size===use.length?`<div class="okmsg" style="text-align:center;margin-top:12px">🎉 أحسنتِ! أنهيتِها في ${toAr(moves)} محاولات</div>`:''}`);
      $$('[data-j]').forEach(b=>b.onclick=()=>{ const j=+b.dataset.j; if(lock||open.includes(j)||hit.has(cards[j].id))return; open.push(j); draw();
        if(open.length===2){ moves++; lock=true; const [x,y]=open; setTimeout(()=>{ if(cards[x].id===cards[y].id&&cards[x].t!==cards[y].t) hit.add(cards[x].id); open=[];lock=false;draw() },900) } });
    }; return draw();
  }
  if(kind==='fill'){
    const items=shuffle(all); let i=0,score=0;
    const draw=()=>{ if(i>=items.length) return setView(`<div class="card" style="text-align:center"><h2>أكملي الفراغ ✓</h2><p style="font-size:20px">نتيجتك ${toAr(score)} من ${toAr(items.length)}</p>${back}</div>`);
      const q=items[i]; setView(`<div class="qhead"><b>أكملي الفراغ</b>${back}</div><div class="small muted">${toAr(i+1)} من ${toAr(items.length)}</div>
       <div class="card">${qBody(q)}<div class="sunbox" style="font-size:19px;text-align:center" id="blank">الإجابة: <b>______</b></div>
       <div class="row" style="justify-content:center">${shuffle([0,1,2,3]).map(k=>`<button class="btn sec" data-k="${k}">${optHTML(q.opts[k])}</button>`).join('')}</div><div id="fb"></div></div>`);
      $$('[data-k]').forEach(b=>b.onclick=()=>{ const k=+b.dataset.k, ok=k===q.ans; if(ok)score++; $('#blank').innerHTML='الإجابة: '+optHTML(q.opts[q.ans]);
        $$('[data-k]').forEach(x=>x.disabled=true); $('#fb').innerHTML=(ok?'<div class="okmsg">✓ صحيح</div>':'<div class="err">✗ الإجابة الصحيحة ظاهرة في الفراغ</div>')+`<button class="btn block" style="margin-top:8px" id="nx">التالي</button>`; $('#nx').onclick=()=>{i++;draw()} });
    }; return draw();
  }
}

/* ================= شاركنا رأيك يا ولي الأمر 🏠 ================= */
function parentStation(){

     <p>وصلنا تقييمكم (${'★'.repeat(ME.parent.stars)}) ورأيكم يهمّنا ويساعدنا على تطوير التعلّم.</p><button class="btn block" onclick="home()">العودة للخريطة</button></div>`) }
  let stars=0;

function lgamma(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=x,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(const k of c)s+=k/++y;return -t+Math.log(2.5066282746310005*s/x)}
function betacf(a,b,x){let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<1e-30)d=1e-30;d=1/d;let h=d;
  for(let m=1;m<=200;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;h*=d*c;
  aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<3e-7)break}return h}
function ibeta(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b}
function impact(pairs){
  const n=pairs.length; if(n<2) return {n};
  const mPre=pairs.reduce((s,p)=>s+p[0],0)/n, mPost=pairs.reduce((s,p)=>s+p[1],0)/n;
  const d=pairs.map(p=>p[1]-p[0]), md=mPost-mPre; const sd=Math.sqrt(d.reduce((s,x)=>s+(x-md)**2,0)/(n-1));

function etaTxt(e){return e==null?'':e>=0.14?'أثر كبير':e>=0.06?'أثر متوسط':e>=0.01?'أثر صغير':'أثر ضعيف جدًا'}

const TB=h=>{$('#tb').innerHTML=h};

function parentStats(){ const rs=recsF(); const rated=rs.filter(r=>r.parent); const avg=rated.length?rated.reduce((s,r)=>s+r.parent.stars,0)/rated.length:null; return {n:rs.length,rated:rated.length,avg,list:rated} }

  <h3>المتوسطات حسب المرحلة</h3>${stageChart()}

function stageStats(sid,rs){ rs=rs||recsF(); const I=rs.map(r=>stInfo(r,sid)); const P=I.filter(i=>i.pre!=null&&i.post!=null);
  const av=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;

function stageChart(){

/* ---------- قياس الأثر ---------- */
function impactTable(pr){
  if(!pr.n||pr.n<2) return '<p class="muted">يلزم طالبتان على الأقل أنهتا القبلي والبعدي.</p>';
  const sig=pr.p<0.05;
  return `<div class="tw"><table class="dt"><tbody>
   <tr><th>عدد الطالبات (أزواج قبلي/بعدي)</th><td class="n">${toAr(pr.n)}</td></tr>
   <tr><th>متوسط القبلي</th><td class="n">${num(pr.mPre)}</td></tr><tr><th>متوسط البعدي</th><td class="n">${num(pr.mPost)}</td></tr>
   <tr><th>متوسط الفرق</th><td class="n">${num(pr.md)}</td></tr><tr><th>الانحراف المعياري للفروق</th><td class="n">${num(pr.sd)}</td></tr>
   <tr><th>قيمة «ت» (درجات الحرية ${toAr(pr.df)})</th><td class="n">${isFinite(pr.t)?num(pr.t):'∞'}</td></tr>
   <tr><th>مستوى الدلالة</th><td>${num(pr.p,4)} — ${sig?'دالة إحصائيًا عند ٠٫٠٥':'غير دالة إحصائيًا'}</td></tr>
   <tr><th>مربع إيتا (η²)</th><td>${num(pr.eta,3)} — ${etaTxt(pr.eta)}</td></tr>
   <tr><th>حجم الأثر كوهين d</th><td>${pr.cd==null?'—':num(pr.cd)+' — '+dTxt(pr.cd)}</td></tr>
   <tr><th>نسبة الكسب المعدّل لبليك</th><td>${pr.blake==null?'—':num(pr.blake)+' — '+(pr.blake>=1.2?'فاعلية مقبولة (≥ ١٫٢)':'أقل من حد الفاعلية ١٫٢')}</td></tr>
  </tbody></table></div>`;
}

   ${STAGES.map(s=>{const st=stageStats(s.id);const p=impact(recsF().map(r=>stInfo(r,s.id)).filter(i=>i.pre!=null&&i.post!=null).map(i=>[i.pre,i.post]));

/* ---------- المتابعة العلاجية ---------- */
function indFails(){
  const res=[]; STAGES.filter(s=>!F.sid||s.id===F.sid).forEach(s=>{ const by={}; testQs(s).forEach(q=>{by[q.ind]=by[q.ind]||{t:0,w:0}});
    recsF().forEach(r=>{const p=((r.stages||{})[s.id]||{}).post; if(!p||!p.done)return; testQs(s).forEach(q=>{const a=p.answers[q.id];by[q.ind].t++; if(!a||!a.ok)by[q.ind].w++})});
    Object.entries(by).forEach(([ind,v])=>{ if(v.t) res.push({s,ind,txt:s.inds[ind],rate:v.w/v.t*100,t:v.t}) }) });
  return res.sort((a,b)=>b.rate-a.rate);
}
function notImproved(){ const out=[]; recsF().forEach(r=>STAGES.filter(s=>!F.sid||s.id===F.sid).forEach(s=>{const i=stInfo(r,s.id); if(i.needRem) out.push({r,s,i})})); return out }
function tRemedial(){
  const f=indFails().slice(0,10), ni=notImproved();
  TB(`<h3>🎯 المتابعة العلاجية: أين أخفقت الطالبات؟</h3><p class="small muted">نسبة الإجابات الخاطئة في الاختبار البعدي لكل مؤشر.</p>

   <h3>من لم تتحسّن (التحسن صفر أو بالسالب)</h3>

function parseGrid(g,cls){
  const isPh=v=>!!normPhone(v)&&/^9665/.test(normPhone(v));
  let h=-1,nc=-1,pc=-1,cc=-1;
  for(let i=0;i<Math.min(g.length,25);i++){const r=g[i].map(x=>String(x||''));const n=r.findIndex(x=>/اسم/.test(x)&&!/ولي|الأب|الام|الأم/.test(x)); if(n>=0){h=i;nc=n;
    pc=r.findIndex(x=>/جوال|هاتف|موبايل|رقم ال/.test(x)&&/ولي|الأمر|الامر|الأب/.test(x)); if(pc<0)pc=r.findIndex(x=>/جوال|هاتف|موبايل/.test(x));
    cc=r.findIndex(x=>/الفصل|الشعبة/.test(x)); break}}
  const body=g.slice(h+1);
  if(nc<0){ // اكتشاف بالمحتوى
    const cols=(g[0]||[]).length; let best=-1,bs=0; for(let c=0;c<cols;c++){const s=g.filter(r=>cleanName(r[c]).split(' ').length>=3).length;if(s>bs){bs=s;best=c}} nc=best; }
  if(pc<0){ const cols=Math.max(...g.map(r=>r.length)); let best=-1,bs=0; for(let c=0;c<cols;c++){const s=body.filter(r=>isPh(r[c])).length;if(s>bs){bs=s;best=c}} pc=best }
  return body.map(r=>({name:cleanName(r[nc]),phone:pc>=0?normPhone(r[pc]):'',cls:cc>=0?String(r[cc]||'').trim()||cls:cls})).filter(x=>x.name.split(' ').length>=2);
}
function parsePaste(t,cls){return t.split(/\n+/).map(l=>{const m=toEn(l).match(/(\+?\d[\d\s-]{7,15}\d)/);return{name:cleanName(m?l.replace(/[0-9٠-٩+\s-]{8,}/g,' '):l),phone:m?normPhone(m[1]):'',cls}}).filter(x=>x.name.split(' ').length>=2)}
function loadScript(src){return new Promise((res,rej)=>{if([...document.scripts].some(s=>s.src===src))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('تحقق من الإنترنت'));document.head.appendChild(s)})}
</script>

     <p>سلم التقدير حسب البعدي: ممتاز ٩٠–١٠٠، جيد جدًا ٨٠–٨٩، جيد ٧٠–٧٩، مقبول ٦٠–٦٩، ضعيف أقل من ٦٠.</p>${pSig()}`)}).join('');
  const one=ids.length===1?RECS.find(x=>x.id===ids[0]):null;
  const nm=one?`Report-${fileCls(one.cls)}-${toAr(RECS.filter(x=>x.cls===one.cls).sort((a,b)=>a.name.localeCompare(b.name,'ar')).findIndex(x=>x.id===one.id)+1).replace(/[٠-٩]/g,d=>AR.indexOf(d))}.pdf`:'Reports-Students-Math.pdf';
  showPdf(pages,nm,false,one?'تقرير '+one.name:'التقارير الفردية');
  if(forParent&&one) setTimeout(()=>{const b=document.createElement('div');b.className='sunbox small';b.innerHTML='بعد إرسال الملف من «📤 مشاركة PDF» اختاري محادثة ولي الأمر في واتساب.';const box=$('#mdl .box');if(box)box.insertBefore(b,box.children[2]);logContact('st:'+one.id,'result',one.name,true)},50);
}
function exportCsv(){
  const head=['الاسم','الفصل',...STAGES.flatMap(s=>[s.title+' قبلي',s.title+' بعدي',s.title+' التحسن',s.title+' علاجي']),'متوسط القبلي','متوسط البعدي','التحسن','التقدير','مرات الخروج','تسرّع','تقييم ولي الأمر'];
  const rows=recsF().map(r=>{const sm=summary(r);return [r.name,r.cls,...STAGES.flatMap(s=>{const i=stInfo(r,s.id);return[i.pre??'',i.post??'',i.imp??'',i.remScore??'']}),sm.pre!=null?Math.round(sm.pre):'',sm.post!=null?Math.round(sm.post):'',sm.imp!=null?Math.round(sm.imp):'',grade(sm.post),r.exitsTotal||0,r.rushed||0,r.parent?r.parent.stars:'']});
  const csv='\uFEFF'+[head,...rows].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv); a.download='Results-Math.csv'; document.body.appendChild(a); a.click(); a.remove(); toast('تم تنزيل Results-Math.csv');
}
function certEligible(){
  return recsF().map(r=>{const good=STAGES.filter(s=>{const i=stInfo(r,s.id);return i.post!=null&&i.post>=80&&i.imp>0}); if(!good.length)return null;
    const sm=summary(r); return {r,good,type:sm.allDone?'full':'excel'}}).filter(Boolean);
}

   <div style="position:relative;text-align:center;padding:40px 70px">

   <div style="font-size:${full?52:46}px;font-weight:700;color:${full?'#9a7a10':'#4B3BC4'};margin-top:30px">${full?'شهادة إتمام الرحلة':'شهادة تميّز'}</div>
   <div style="font-size:22px;margin-top:14px">تُمنح الطالبة</div><div style="font-size:40px;font-weight:700;margin:6px 0">${esc(e.r.name)}</div>
   <div style="font-size:21px">من الفصل ${esc(e.r.cls)} ${full?`لإتمامها «${APP.title}» بجميع مراحلها بتميّز`:`لتميّزها في «${APP.title}» في: ${e.good.map(s=>s.title).join('، ')}`}</div>
   <div style="font-size:20px;margin-top:8px">متمنين لها دوام التفوق والنجاح 🌟</div>
   <div style="display:flex;justify-content:space-between;margin-top:56px;font-size:20px;font-weight:700"><span>معلمة المادة<br>${APP.teacher}</span><span>${dH(Date.now())}</span><span>مديرة المدرسة<br>${APP.principal}</span></div></div>`,true)}).join('');
  TM.certs=TM.certs||{}; L.forEach(e=>TM.certs[e.r.id]={type:e.type,at:Date.now()}); await saveTM();

/* ================= تعديل الأسئلة ================= */
let QS_STAGE=STAGES[0].id;
function tQuestions(){
  const s=stageById(F.sid||QS_STAGE); QS_STAGE=s.id;
  TB(`<div class="row"><select id="qsS" style="max-width:300px">${STAGES.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select><button class="btn sm" onclick="editQ('${s.id}',null)">＋ سؤال جديد</button></div>
   <div class="sunbox small">ملفك فيه ${toAr(s.qs.length)} أسئلة لهذه المرحلة: ${toAr(testQs(s).length)} للقبلي/البعدي و${toAr(trainQs(s).length)} للتدريب. الشرط ١٠ أسئلة للقبلي/البعدي، فأضيفي أسئلة من «＋ سؤال جديد» عند توفرها.</div>
   ${s.qs.map((q,i)=>`<div class="card"><div class="row"><span class="chip ${q.role==='test'?'now':'done'}">${q.role==='test'?'قبلي/بعدي':'تدريب'}</span><span class="chip">المؤشر ${toAr(q.ind)}</span>${q.off?'<span class="chip rem">موقوف</span>':''}${(TM.qEdits||{})[q.id]?'<span class="chip">معدّل</span>':''}<span class="grow"></span><button class="btn sm sec" onclick="editQ('${s.id}','${q.id}')">✏️ تعديل</button></div>
     ${qBody(q)}<ol type="أ" style="margin:6px 0">${q.opts.map((o,k)=>`<li style="${k===q.ans?'color:var(--ok);font-weight:700':''}">${optHTML(o)}${k===q.ans?' ✓':''}</li>`).join('')}</ol></div>`).join('')}`);
  $('#qsS').onchange=e=>{QS_STAGE=e.target.value;F.sid='';tQuestions()};
}
function editQ(sid,qid){
  const s=stageById(sid); const q=qid?s.qs.find(x=>x.id===qid):{id:sid+'n'+Date.now().toString(36),ind:1,role:'train',stem:'',opts:['','','',''],ans:0,exp:[],isNew:true};
  modal(`<h3>${qid?'تعديل سؤال':'سؤال جديد'}</h3><p class="small muted">الكسر: {3/4} — العدد الكسري: {2 1/5} — الجذر: √{5} — الأس: ^{2} — والمعادلة التي تُكتب من اليسار لليمين بين [[ و ]] مثل [[3 − (−5) = 8]].</p>
   <label>نص السؤال</label><textarea id="eS">${esc(q.stem)}</textarea>
   ${[0,1,2,3].map(k=>`<label>الخيار ${LET[k]}</label><input type="text" id="eO${k}" value="${esc(q.opts[k]||'')}">`).join('')}
   <div class="row"><div class="grow"><label>الإجابة الصحيحة</label><select id="eA">${LET.map((l,k)=>`<option value="${k}" ${q.ans===k?'selected':''}>${l}</option>`).join('')}</select></div>
   <div class="grow"><label>النوع</label><select id="eR"><option value="test" ${q.role==='test'?'selected':''}>قبلي/بعدي</option><option value="train" ${q.role==='train'?'selected':''}>تدريب</option></select></div>
   <div class="grow"><label>المؤشر</label><select id="eI">${Object.keys(s.inds).map(k=>`<option ${+k===q.ind?'selected':''}>${k}</option>`).join('')}</select></div></div>
   <label>خطوات الحل (كل خطوة في سطر)</label><textarea id="eE">${esc((q.exp||[]).join('\n'))}</textarea>
   <label><input type="checkbox" id="eOff" ${q.off?'checked':''}> إيقاف هذا السؤال</label>
   <div class="infobox" id="ePv"></div>
   <div class="row"><button class="btn grow" id="eSv">حفظ</button>${qid&&!q.isNew&&(TM.qEdits||{})[qid]?'<button class="btn ghost" id="eRs">إرجاع للأصل</button>':''}</div>`);
  const read=()=>({stem:$('#eS').value,opts:[0,1,2,3].map(k=>$('#eO'+k).value),ans:+$('#eA').value,role:$('#eR').value,ind:+$('#eI').value,exp:$('#eE').value.split('\n').map(x=>x.trim()).filter(Boolean),off:$('#eOff').checked});
  const pv=()=>{const x=Object.assign({},q,read());$('#ePv').innerHTML='<b>معاينة:</b>'+qBody(x)+x.opts.map((o,k)=>`<div>${LET[k]}) ${optHTML(o)}</div>`).join('')};
  $$('#mdl input,#mdl textarea,#mdl select').forEach(e=>e.oninput=pv); pv();
  $('#eSv').onclick=async()=>{ const x=read(); if(!x.stem.trim()||x.opts.some(o=>!o.trim())){toast('اكتبي السؤال والخيارات الأربعة');return}
    TM.qEdits=TM.qEdits||{};
    const isAdded=(TM.qEdits['__new_'+sid]||[]).some(n=>n.id===q.id)||q.isNew;
    if(isAdded){ const L=TM.qEdits['__new_'+sid]=TM.qEdits['__new_'+sid]||[]; const i=L.findIndex(n=>n.id===q.id); const nq=Object.assign({id:q.id},x); if(i>=0)L[i]=nq; else L.push(nq) }
    else TM.qEdits[q.id]=x;
    await saveTM(); applyQEdits(); closeModal(); toast('تم الحفظ — يظهر للطالبات فورًا'); tQuestions() };
  if($('#eRs')) $('#eRs').onclick=async()=>{delete TM.qEdits[qid];await saveTM();applyQEdits();closeModal();tQuestions()};
}

/* ================= الإعدادات ================= */
function tSettings(){
  const cls=classes();
  TB(`<div class="card"><h3>🔗 رابط Apps Script (Google Sheets)</h3><input id="su" type="url" dir="ltr" value="${esc(scriptUrl())}" placeholder="https://script.google.com/macros/s/.../exec">
    <div class="row" style="margin-top:8px"><button class="btn sm" id="suS">حفظ واختبار الاتصال</button><span id="suR" class="small"></span></div>
    <p class="small muted">بعد الحفظ اضغطي «تنزيل نسخة الطالبات» بالأسفل وارفعيها على Netlify حتى يصل الرابط لجوالات الطالبات.</p></div>
   <div class="card"><h3>🔒 رمز التسجيل</h3><p class="small muted">${TM.regHash?'الرمز مفعّل: الطالبات الجديدات لا يسجّلن إلا به.':'غير مفعّل: أي طالبة تستطيع التسجيل.'}</p>
    <div class="row"><input id="rg" type="tel" inputmode="numeric" maxlength="6" placeholder="٤–٦ أرقام" style="max-width:180px"><button class="btn sm" id="rgS">حفظ الرمز</button>${TM.regHash?'<button class="btn sm ghost" id="rgC">إلغاء الرمز</button>':''}</div></div>
   <div class="card"><h3>⏰ آخر موعد</h3><div class="row"><input id="dl" type="date" value="${TM.deadline||''}" style="max-width:200px"><button class="btn sm" id="dlS">حفظ</button><button class="btn sm ghost" id="dlC">بدون موعد</button></div>
    <p class="small muted">${TM.deadline?dBoth(TM.deadline+'T12:00:00'):''}</p></div>
   <div class="card"><h3>🏫 الفصول وأعدادها</h3><textarea id="cl" dir="rtl">${cls.map(c=>c.name+' : '+c.size).join('\n')}</textarea><button class="btn sm" id="clS" style="margin-top:6px">حفظ الفصول</button></div>
   <div class="card"><h3>🎬 روابط الفيديو واللعبة لكل مرحلة</h3><p class="small muted">رابط يوتيوب يظهر داخل الأداة. لعبة Wordwall: انسخي «رابط التضمين» (embed) لتظهر داخل الأداة، أو الرابط العادي لتُفتح في نافذة.</p>
    ${STAGES.map(s=>{const m=media(s.id);return `<div style="margin:8px 0"><b>${esc(s.title)}</b><input id="mv_${s.id}" type="url" dir="ltr" placeholder="فيديو" value="${esc(m.video)}" style="margin-top:4px"><input id="mg_${s.id}" type="url" dir="ltr" placeholder="لعبة Wordwall" value="${esc(m.game)}" style="margin-top:4px"></div>`}).join('')}
    <button class="btn sm" id="mdS">حفظ الروابط</button></div>
   <div class="card"><h3>🔐 تغيير رمز المعلمة</h3><input id="nc1" type="password" placeholder="الرمز الجديد (٦ خانات أو أكثر)"><input id="nc2" type="password" placeholder="أعيدي كتابته" style="margin-top:6px"><button class="btn sm" id="ncS" style="margin-top:6px">تغيير</button></div>
   <div class="card"><h3>⬇️ تنزيل نسخة الطالبات بالإعدادات الجديدة</h3><p class="small muted">ملف index.html فيه رابط Apps Script والفصول. ارفعيه على Netlify بنفس طريقة التحديث.</p><button class="btn" id="dlv">تنزيل index.html</button>
    <button class="btn ghost" id="bk" style="margin-top:6px">💾 نسخة احتياطية من البيانات (JSON)</button></div>`);
  $('#suS').onclick=async()=>{const u=$('#su').value.trim(); LS.set('mj_url',u); $('#suR').textContent='جارٍ الاختبار…';
    try{const r=await fetch(u+'?action=ping&t='+Date.now());const j=await r.json();$('#suR').innerHTML=j.ok?'<span class="okmsg">✓ متصلة</span>':'<span class="err">رد غير متوقع</span>'; if(j.ok){await saveTM()}}catch(e){$('#suR').innerHTML='<span class="err">تعذّر الاتصال — راجعي خطوات النشر</span>'}};
  $('#rgS').onclick=async()=>{const c=toEn($('#rg').value).replace(/\D/g,''); if(c.length<4||c.length>6){toast('الرمز من ٤ إلى ٦ أرقام');return} TM.regSalt=rnd(8); TM.regHash=await sha(TM.regSalt+':'+c); PV.regPlain=c; await saveTM(); toast('تم حفظ رمز التسجيل ويعمل فورًا'); tSettings()};
  if($('#rgC')) $('#rgC').onclick=async()=>{delete TM.regHash;delete TM.regSalt;PV.regPlain='';await saveTM();tSettings()};
  $('#dlS').onclick=async()=>{TM.deadline=$('#dl').value||null;await saveTM();toast('تم الحفظ');tSettings()}; $('#dlC').onclick=async()=>{TM.deadline=null;await saveTM();tSettings()};
  $('#clS').onclick=async()=>{const L=$('#cl').value.split('\n').map(l=>l.split(/[:：=]/)).filter(p=>p[0].trim()).map(p=>({name:p[0].trim(),size:+toEn(p[1]||'0').replace(/\D/g,'')||0})); if(!L.length)return; TM.classes=L; CFG.classes=L; await saveTM(); toast('تم حفظ الفصول')};
  $('#mdS').onclick=async()=>{TM.media={};STAGES.forEach(s=>TM.media[s.id]={video:$('#mv_'+s.id).value.trim(),game:$('#mg_'+s.id).value.trim()});await saveTM();toast('تم حفظ الروابط')};
  $('#ncS').onclick=async()=>{const a=$('#nc1').value,b=$('#nc2').value;if(a.length<6||a!==b){toast('تحققي من الرمز الجديد');return}
    const oldAuth=T.auth; const salt=rnd(12),kdfSalt=rnd(16),key=await kdf(a,kdfSalt);
    let priv=TM.teacher.priv; try{const pk=await aesDec(T.key,TM.teacher.priv);priv=await aesEnc(key,pk)}catch(e){}
    TM.teacher=Object.assign({},TM.teacher,{salt,hash:await sha(salt+':'+a),kdfSalt,priv}); T.key=key; T.code=a; T.auth=await authOf(a);
    TM.enc=await aesEnc(key,PV); await DB.save(TM,{auth:oldAuth,newAuth:T.auth}); LS.set('mj_tm',TM); toast('تم تغيير رمز المعلمة')};
  $('#dlv').onclick=downloadVersion;
  $('#bk').onclick=()=>{const data=JSON.stringify({at:Date.now(),records:RECS,tmeta:TM});const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(data);a.download='Backup-Math-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove()};
}
async function downloadVersion(){
  try{
    const src=await (await fetch(location.href.split('#')[0],{cache:'no-store'})).text();
    const cfg=JSON.stringify({scriptUrl:scriptUrl(),classes:classes()});
    const out=src.replace(/\/\*CFG\*\/[\s\S]*?\/\*ENDCFG\*\//,'/*CFG*/'+cfg+'/*ENDCFG*/');
    if(out===src&&!src.includes(cfg)) throw new Error('no-cfg');
    const a=document.createElement('a'); a.href='data:text/html;charset=utf-8,'+encodeURIComponent(out); a.download='index.html'; document.body.appendChild(a); a.click(); a.remove();
    toast('تم تنزيل index.html — ارفعيه على Netlify',4000);
  }catch(e){ toast('تعذّر التنزيل من هنا. افتحي الأداة من رابط Netlify وأعيدي المحاولة.',4500) }
}

/* ================= التشغيل ================= */
async function boot(){
  setView('<div class="card" style="text-align:center">جارٍ التحميل…</div>');
  await loadTM(); applyQEdits();
  if(location.hash==='#teacher') return teacherStart();
  startStudent();
}
window.addEventListener('hashchange',()=>location.reload());
boot();
</script>
